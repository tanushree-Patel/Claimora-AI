# A generic, single database configuration.

[alembic]
# path to migration script directory
script_location = app/db/migrations

# sys.path path, inserted to sys.path if present
prepend_sys_path = .

# version location specification
# version_locations = %(here)s/bar %(here)s/bat app/db/migrations/versions

sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/claimora_db

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
